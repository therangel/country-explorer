<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Explorer</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <img src="./assets/world.png" alt="world">
        <h1>Country Explorer</h1>
    </header>

    <main class="main-content">

        <div class="filters">

            <label for="country-name">
                <p>Search by Country Name: </p>
                <input type="search" id="country-name-input" placeholder="Enter Country Name">
                <span class="invalid-input-message" id="invalid-country_name">Enter valid Country Name</span>
            </label>

            <label for="region">
                <p>Select a Region: </p>
                <select name="region" id="region-input">
                    <option value="" selected>All regions</option>
                    <option value="Africa">Africa</option>
                    <option value="America">America</option>
                    <option value="Asia">Asia</option>
                    <option value="Europa">Europa</option>
                    <option value="Oceania">Oceania</option>
                </select>
            </label>

            <label for="population">
                <p>Search by Population: </p>
                <input type="number" id="population-input" placeholder="0" min="0" max="1500000000" >
                <small>Max - 1.5 Billion (1500000000)</small>
                <span class="invalid-input-message" id="invalid-population">Country's population cannot be greater than 1.5 billion</span>
            </label>

        </div>

        <div class="country-cards-container"></div>

        <div class="container-button">
            
            <button class="btn show-more-btn">
                <span>Show More</span>
            </button>
        </div>

    </main>

    <footer class="footer">
        <p>by Matheus Rangel</p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
