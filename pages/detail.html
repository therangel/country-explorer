<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="./details.css">


</head>
<body>

    <header class="header">
        <img src="../assets/world.png" alt="world">
        <h1>Country Explorer</h1>
    </header>

    <main class="main-content">

        <div class="container-button">
            <button class="btn" id="back-page-btn">
               < Back
            </button>
        </div>    
        
        <div class="card-container" id="container-card-detail">

            <div class="country-card">
                <h3 class="country-name-field"></h3>

                <img src="" alt="" class="country-flag-field">

                <div class="country-stats">

                    <div class="stats-container">
                        <p>Population: </p>
                        <div class="population-field"></div>
                    </div>

                    <div class="stats-container">
                        <p>Region: </p>
                        <div class="region-field"></div>
                    </div>

                    <div class="stats-container">
                        <p>SubRegion: </p>
                        <div class="sub-region-field"></div>
                    </div>

                    <div class="stats-container">
                        <p>Capital: </p>
                        <div class="capital-field"></div>
                    </div>

                    <div class="stats-container">
                        <p>Currencies: </p>
                        <div class="currencies-field"></div>
                    </div>

                    <div class="stats-container">
                        <p>Languages: </p>
                        <div class="languages-field"></div>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <footer class="footer">
         <p>by Matheus Rangel</p>
    </footer>

    <script src="./detail.js"></script>
</body>
</html>
